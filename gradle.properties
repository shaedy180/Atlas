# Atlas, https://github.com/shaedy180/Atlas

# Mod metadata
mod_version = 0.3.0
mod_id = atlas
mod_name = Atlas
mod_description = Recipe and item intelligence for Minecraft
mod_license = LGPL-3.0-or-later
