name: Bug Report
description: Report a bug or unexpected behavior
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill out the form below as completely as possible.

  - type: input
    id: version
    attributes:
      label: Atlas Version
      description: Which version of Atlas are you using?
      placeholder: e.g. 0.1.0
    validations:
      required: true

  - type: input
    id: minecraft-version
    attributes:
      label: Minecraft Version
      description: Which Minecraft version are you running?
      placeholder: e.g. 26.1.1
    validations:
      required: true

  - type: input
    id: loader
    attributes:
      label: Mod Loader and Version
      description: Which mod loader and version are you using?
      placeholder: e.g. Fabric Loader 0.18.6
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can this bug be reproduced?
      placeholder: |
        1. Open the game with Atlas installed
        2. Do X
        3. Observe Y
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Log Output
      description: Paste any relevant log output or crash reports here. This will be formatted as code automatically.
      render: text
    validations:
      required: false

  - type: textarea
    id: other-mods
    attributes:
      label: Other Installed Mods
      description: List any other mods you have installed. This helps identify potential conflicts.
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other information that might be helpful (screenshots, videos, etc.).
    validations:
      required: false
